# Merge with compose.yaml after staging acceptance; certificate issuance is external.
services:
  web:
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Configure the production hostname}
    ports:
      - '443:443'
    volumes:
      - ./infra/nginx.production.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${TLS_CERTIFICATE_DIR:?Configure the certificate directory}:/etc/nginx/tls:ro
    restart: unless-stopped
  api:
    restart: unless-stopped
  worker:
    restart: unless-stopped
  scheduler:
    restart: unless-stopped
  db:
    restart: unless-stopped
  redis:
    restart: unless-stopped
