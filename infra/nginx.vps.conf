# Docker may assign a new API address after a deployment.
# Resolve it regularly instead of keeping the startup address indefinitely.
upstream opsdemo_api {
    zone opsdemo_api 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 5s;
    server api:8000 resolve;
}
# Only Caddy exposes a host port; all application traffic arrives via HTTPS.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 2m;
    location ~ ^/(api/|admin/|health/) {
        proxy_pass http://opsdemo_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        # Caddy overwrites this header; web has no public ports.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $http_x_opsdemo_client_ip;
        proxy_read_timeout 65s;
        proxy_buffering off;
    }
    location /static/ { alias /srv/static/; }
    location /assets/ { try_files $uri =404; expires 1y; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control 'no-cache'; }
}
