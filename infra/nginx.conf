# Docker may assign a new API address after a deployment.
# Resolve it regularly instead of keeping the startup address indefinitely.
upstream opsdemo_api {
    zone opsdemo_api 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 5s;
    server api:8000 resolve;
}
# Local development only. Production requires an HTTPS termination configuration.
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    client_max_body_size 2m;
    # Revalidate the app shell so reopening an older EXE/browser loads current assets.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    location /health/ {
        proxy_pass http://opsdemo_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 15s;
    }
    location /api/ {
        proxy_pass http://opsdemo_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /admin/ {
        proxy_pass http://opsdemo_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /static/ { alias /srv/static/; }
    location / { try_files $uri $uri/ /index.html; }
}
