# Standalone VPS stack. Do not combine this with compose.yaml.
name: opsdemo-operations
x-backend: &backend
  build:
    context: .
    dockerfile: infra/backend.Dockerfile
  env_file: .env.production
  restart: unless-stopped
  logging: &logs
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logs
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    logging: *logs
    command: [redis-server, --appendonly, 'yes', --maxmemory, 128mb, --maxmemory-policy, noeviction]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    <<: *backend
    restart: 'no'
    command: [sh, -c, 'python manage.py check --deploy --fail-level WARNING && python manage.py migrate --noinput && python manage.py bootstrap_roles && python manage.py collectstatic --noinput']
    volumes:
      - static_data:/app/staticfiles
  api:
    <<: *backend
    volumes:
      - media_data:/app/media
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -m, apps.core.healthprobe]
      interval: 15s
      timeout: 10s
      retries: 5
  worker:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: [celery, -A, 'config.celery:app', worker, --loglevel=INFO, --concurrency=1]
  scheduler:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: [celery, -A, 'config.celery:app', beat, --loglevel=INFO, '--schedule=/tmp/celerybeat-schedule']
  web:
    build:
      context: .
      dockerfile: infra/frontend.Dockerfile
    restart: unless-stopped
    logging: *logs
    volumes:
      - static_data:/srv/static:ro
      - ./infra/nginx.vps.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
  https:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logs
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Set the production hostname}
      ACME_EMAIL: ${ACME_EMAIL:?Set certificate contact email}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
volumes:
  postgres_data:
  redis_data:
  static_data:
  media_data:
  caddy_data:
  caddy_config:
