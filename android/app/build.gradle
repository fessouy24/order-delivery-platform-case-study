plugins { id 'com.android.application' }
def companyUrl = providers.gradleProperty('companyServerUrl').orElse('').get()
if (companyUrl && !(companyUrl ==~ /^https:\/\/[A-Za-z0-9.-]+(?::\d+)?\/?$/)) {
    throw new GradleException('companyServerUrl must be an HTTPS origin without a path, credentials, query or fragment.')
}
def keyPath = System.getenv('ANDROID_KEYSTORE_PATH')
android {
    namespace 'com.opsdemo.operations'
    compileSdk 36
    defaultConfig {
        applicationId 'com.opsdemo.operations'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'com.opsdemo.operations.SessionPersistenceProbe'
    }
    buildFeatures { buildConfig true; resValues true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        debug {
            storeFile rootProject.file('../.local-runtime/android-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (keyPath) {
            company {
                storeFile file(keyPath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.trial'
            versionNameSuffix '-trial'
            buildConfigField 'String', 'SERVER_URL', '"http://localhost:8080"'
            resValue 'string', 'app_name', 'OPSDEMO Trial'
        }
        release {
            buildConfigField 'String', 'SERVER_URL', '"' + companyUrl.replaceAll('/$', '') + '"'
            resValue 'string', 'app_name', 'OPSDEMO'
            if (keyPath) signingConfig signingConfigs.company
        }
    }
}
tasks.configureEach {
    if (name == 'preReleaseBuild') doFirst {
        if (!companyUrl) throw new GradleException('Set -PcompanyServerUrl=https://YOUR_COMPANY_HOST for an employee release.')
        for (key in ['ANDROID_KEYSTORE_PATH','ANDROID_KEYSTORE_PASSWORD','ANDROID_KEY_ALIAS','ANDROID_KEY_PASSWORD']) {
            if (!System.getenv(key)) throw new GradleException('Company release signing is missing ' + key)
        }
    }
}
